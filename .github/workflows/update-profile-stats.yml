name: Update Profile Statistics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-profile-stats.yml
      - scripts/generate-profile-stats.py
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Checkout Leo statistics components
        uses: actions/checkout@v4
        with:
          repository: leonardokr/leo-git-statistics
          ref: v2
          path: leo-git-statistics
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install statistics dependencies
        run: python -m pip install -r leo-git-statistics/requirements.txt

      - name: Generate light statistics cards for profile owner
        env:
          ACCESS_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: tiga-alves
          TZ: America/Sao_Paulo
        run: |
          python scripts/generate-profile-stats.py leo-git-statistics
          mkdir -p profile
          for card in overview languages streak; do
            cp "leo-git-statistics/generated_images/${card}light.svg" profile/
          done

      - name: Validate profile cards
        shell: bash
        run: |
          set -euo pipefail
          for card in overview languages streak; do
            test -s "profile/${card}light.svg"
          done

      - name: Upload generated cards
        uses: actions/upload-artifact@v4
        with:
          name: light-profile-statistics
          path: |
            profile/overviewlight.svg
            profile/languageslight.svg
            profile/streaklight.svg
          if-no-files-found: error

  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Download generated cards
        uses: actions/download-artifact@v4
        with:
          name: light-profile-statistics
          path: profile

      - name: Commit profile cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/overviewlight.svg profile/languageslight.svg profile/streaklight.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update light profile statistics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
